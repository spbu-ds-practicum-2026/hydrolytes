[project]
name = "hydrolytes-coordinator"
version = "0.1.0"
description = "Координатор стенда: health-проверки шардов, promote реплики, карта маршрутов"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
coordinator = "coordinator:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
